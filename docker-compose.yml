# Remove the 'version: '3.8' line entirely

services:
  db:
    image: postgres:15
    container_name: myagent-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myagent_network

  backend:
    build: ./backend
    container_name: myagent-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      OPENAI_API_KEY: xx
      OPENAI_MODEL: gpt-3.5-turbo
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000  # Use full .env value for flexibility
      DEV_MODE: "true"
    ports:
      - "8000:8000"
    networks:
      - myagent_network

  frontend:
    build: ./frontend
    container_name: myagent-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:8000  # 👈 Fix: Use service name for internal networking
      GOOGLE_CLIENT_ID: xx
      OPENAI_API_KEY: xx
      REACT_APP_GOOGLE_CLIENT_ID: xx  # 👈 Add: Pass Google ID via env (from .env)
    networks:
      - myagent_network

volumes:
  postgres_data:

networks:
  myagent_network:
    driver: bridge